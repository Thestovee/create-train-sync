name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .cache/dependencies
          key: dependencies-${{ hashFiles('dependencies.lock.json') }}
      - run: python build.py
      - name: Check repeatable JAR
        run: |
          cp dist/trainsync-1.0.0-beta.1.jar /tmp/first.jar
          python build.py --offline
          cmp /tmp/first.jar dist/trainsync-1.0.0-beta.1.jar
      - run: python build.py --component trace --offline
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: jars-and-checksums
          path: dist/
